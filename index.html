<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>LOLA — Armario digital</title>
  <meta name="description" content="Tu armario digital: fotografía tu ropa, recorta el fondo y combínala en el probador." />
  <meta name="theme-color" content="#7c6cf0" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LOLA" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
</head>
<body data-route="armario">
  <div class="aurora" aria-hidden="true"></div>
  <header class="app-header">
    <div class="app-header__brand">
      <span class="app-header__logo">👗</span>
      <div>
        <h1 class="app-header__name">LOLA</h1>
        <p class="app-header__tag">Tu armario digital</p>
      </div>
    </div>
  </header>

  <main id="view" class="view"><!-- las vistas se renderizan aquí --></main>

  <nav class="tabbar">
    <button class="tab" data-route="armario">
      <span class="tab__icon">🧥</span>
      <span class="tab__label">Armario</span>
    </button>
    <button class="tab tab--fab" data-route="anadir">
      <span class="tab__icon">＋</span>
      <span class="tab__label">Añadir</span>
    </button>
    <button class="tab" data-route="probador">
      <span class="tab__icon">🧍‍♀️</span>
      <span class="tab__label">Probador</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
